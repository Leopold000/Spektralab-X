name: android

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "fastlane/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "fastlane/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Read-only by default; only the release job below can write.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools unzip

      - name: Cache upstream sources
        uses: actions/cache@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('scripts/fetch-upstream.sh', 'patches/*.patch') }}

      - name: Fetch upstream
        run: bash scripts/fetch-upstream.sh upstream

      - name: Native adaptation regressions
        run: |
          UP="$PWD/upstream" bash tools/native/run.sh --large
          UP="$PWD/upstream" STRICT=0 bash tools/native/run.sh --large

      - name: Stage engine assets
        run: bash scripts/stage-assets.sh upstream

      # A release is made only from a push to main whose VERSION has not been
      # released yet, and it must be strictly newer than every earlier tag.
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          publish=0
          if [[ "${{ github.event_name }}" == push && "${{ github.ref }}" == refs/heads/main ]]; then
            if ! gh release view "v$v" -R "${{ github.repository }}" >/dev/null 2>&1; then
              publish=1
              latest="$(git ls-remote --tags --refs "https://github.com/${{ github.repository }}.git" 'v*' \
                        | sed 's#.*refs/tags/v##' | sort -V | tail -n1)"
              if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -n1)" != "$v" ]]; then
                echo "::error::VERSION $v is not newer than the latest release v$latest"
                exit 1
              fi
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "VERSION=$v publish=$publish"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SPK_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [ "${{ steps.version.outputs.publish }}" = 1 ]; then
            echo "::error::KEYSTORE_B64 is not set; refusing to publish a debug-signed release"
            exit 1
          else
            echo "::warning::KEYSTORE_B64 is not set; this build is signed with a throwaway debug key"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          SPK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPK_UPSTREAM: ${{ github.workspace }}/upstream
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:testReleaseUnitTest

      - name: Rename APK and checksum
        run: |
          mkdir -p dist
          apk="Spektralab-X-${{ steps.version.outputs.version }}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt 2>/dev/null || true
          (cd dist && sha256sum "$apk" > SHA256SUMS && cat SHA256SUMS)

      # Android 15+ devices with 16 KB pages refuse a library whose LOAD
      # segments are aligned below 16 KB, or an uncompressed one stored at an
      # offset that is not a multiple of 16 KB (useLegacyPackaging = false).
      - name: Check 16 KB page alignment
        run: |
          apk="$(ls dist/*.apk)"
          tmp="$(mktemp -d)"
          unzip -q -o "$apk" 'lib/*' -d "$tmp"
          bad=0
          for so in "$tmp"/lib/*/*.so; do
            min="$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }' | sort -u | while read -r a; do printf '%d\n' "$a"; done | sort -n | sed -n 1p)"
            echo "$(basename "$so"): smallest LOAD alignment $min"
            if [ -z "$min" ] || [ "$min" -lt 16384 ]; then echo "::error::$(basename "$so") LOAD segments are aligned to $min, below 16 KB"; bad=1; fi
          done
          za="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)zipalign"
          "$za" -c -P 16 -v 4 "$apk" > "$tmp/zipalign.txt" || { tail -n 20 "$tmp/zipalign.txt"; echo "::error::zipalign -P 16 check failed"; bad=1; }
          tail -n 1 "$tmp/zipalign.txt"
          rm -rf "$tmp"
          exit $bad

      # The APK that would be released must carry the published certificate.
      - name: Verify signature
        if: steps.version.outputs.publish == '1'
        run: |
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          got="$("$signer" verify --print-certs dist/*.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          want="$(tr -d '[:space:]' < scripts/signing-cert.sha256)"
          echo "signed with $got"
          [ "$got" = "$want" ] || { echo "::error::APK certificate $got is not the published $want"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: Spektralab-X-${{ steps.version.outputs.version }}-run${{ github.run_number }}
          path: dist/*

  release:
    needs: apk
    if: needs.apk.outputs.publish == '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release and its tag
      id-token: write      # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Spektralab-X-${{ needs.apk.outputs.version }}-run${{ github.run_number }}
          path: dist

      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.apk.outputs.version }}
        run: |
          bash scripts/release-notes.sh "$APP_VERSION" dist "${{ github.repository }}" "${{ github.sha }}" > notes.md
          # --target: tag the commit that was built, not whatever main is now.
          gh release create "v$APP_VERSION" dist/*.apk dist/SHA256SUMS \
            --target "${{ github.sha }}" \
            --title "Spektralab-X $APP_VERSION" --notes-file notes.md --prerelease
